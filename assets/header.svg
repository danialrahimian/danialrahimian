<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Danial Rahimian — Frontend Developer · React &amp; TypeScript">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#3178c6"/>
    </linearGradient>
    <clipPath id="clip"><path d="M0 0H1200V170C1100 200 1000 215 880 195C760 175 660 140 540 160C420 180 320 215 200 205C110 197 50 180 0 170Z"/></clipPath>
    <style>
      .title { font: 700 54px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .sub   { font: 500 22px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #dbeafe; letter-spacing: 2px; }
      .fade  { animation: fadeIn 1.2s ease-out both; }
      .fade2 { animation: fadeIn 1.2s ease-out 0.4s both; }
      .w1 { animation: drift 9s ease-in-out infinite alternate; }
      .w2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-120px); } }
      @media (prefers-reduced-motion: reduce) { .fade, .fade2 { animation: none; } .w1, .w2 { animation: none; } }
    </style>
  </defs>

  <!-- Background with wavy bottom edge -->
  <path d="M0 0H1200V170C1100 200 1000 215 880 195C760 175 660 140 540 160C420 180 320 215 200 205C110 197 50 180 0 170Z" fill="url(#bg)"/>

  <!-- Soft animated waves -->
  <g opacity="0.18" fill="#ffffff" clip-path="url(#clip)">
    <path class="w1" d="M0 150C120 120 240 120 360 145C480 170 600 175 720 150C840 125 960 120 1080 145C1200 170 1320 170 1440 150V230H0Z"/>
    <path class="w2" d="M0 165C140 185 280 190 420 170C560 150 700 140 840 160C980 180 1120 190 1260 172C1320 165 1380 160 1440 165V230H0Z"/>
  </g>

  <!-- Decorative code brackets -->
  <text x="80" y="110" font-family="Consolas, 'Fira Code', monospace" font-size="64" fill="#60a5fa" opacity="0.35">&lt;/&gt;</text>
  <text x="1035" y="110" font-family="Consolas, 'Fira Code', monospace" font-size="64" fill="#bfdbfe" opacity="0.35">{ }</text>

  <text class="title fade" x="600" y="92" text-anchor="middle">Danial Rahimian</text>
  <text class="sub fade2" x="600" y="132" text-anchor="middle">FRONTEND DEVELOPER · REACT &amp; TYPESCRIPT</text>
</svg>
